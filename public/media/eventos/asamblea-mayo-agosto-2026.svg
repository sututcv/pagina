  <text x="84" y="420" fill="#f5d58e" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700">13:00 HORAS · CIBI DE LA UTCV</text>
  <text x="84" y="486" fill="#d7e5ee" font-family="Arial, Helvetica, sans-serif" font-size="30">Cuatrimestre Mayo–Agosto 2026</text>

