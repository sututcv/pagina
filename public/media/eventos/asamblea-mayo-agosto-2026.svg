    <path d="M943 235h137v130H943z"/>
    <path d="M971 235v-35h81v35"/>
    <path d="m974 291 36 24 40-55"/>
  </g>

  <text x="80" y="92" fill="#99e0e5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="5">SUTUTCV · ASAMBLEA SINDICAL</text>
  <rect x="80" y="125" width="580" height="8" rx="4" fill="url(#accent)"/>

