<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Asamblea sindical Mayo–Agosto 2026</title>
  <desc id="desc">Convocatoria para el 28 de agosto de 2026 a las 13:00 horas en el CIBI de la UTCV.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051a35"/>
      <stop offset="0.62" stop-color="#0b365f"/>
      <stop offset="1" stop-color="#007e86"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8edfe3"/>
      <stop offset="1" stop-color="#f0c66a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1070" cy="112" r="260" fill="#0a98a1" opacity=".18"/>
  <circle cx="1115" cy="620" r="345" fill="#03142b" opacity=".3"/>
  <path d="M0 575C220 505 410 655 650 574s376-53 550 4v97H0Z" fill="#03142b" opacity=".34"/>

